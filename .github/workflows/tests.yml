name: Backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, web and PostgreSQL integration tests (Docker required)
        run: ./mvnw -B verify -DrequireDocker=true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Local owner password helper tests (mock Supabase only)
        run: node --test ops/password-setup.test.mjs
